name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: frontmatter / version の整合を検証
        run: python3 tools/package.py --check
      - name: アーカイブが作れることを確認
        run: python3 tools/package.py --out dist && ls -la dist
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Claude Code でプラグイン・マーケットプレイス定義を検証
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate --strict .claude-plugin/plugin.json
          claude plugin validate --strict .claude-plugin/marketplace.json
      - uses: actions/upload-artifact@v4
        with:
          name: project-init-archives
          path: dist/
